# Base de datos de desarrollo. Crea `vampiro` (desarrollo) y `vampiro_test` (tests e2e).
services:
  postgres:
    image: postgres:17-alpine
    container_name: vampiro-postgres
    environment:
      POSTGRES_USER: vampiro
      POSTGRES_PASSWORD: vampiro
      POSTGRES_DB: vampiro
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vampiro -d vampiro']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
