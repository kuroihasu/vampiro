<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="topbar">
  <a routerLink="/" class="brand">Vampiro</a>
  <nav aria-label="Principal">
    <a routerLink="/wiki" routerLinkActive="active" ariaCurrentWhenActive="page">Wiki</a>
    <a routerLink="/personajes" routerLinkActive="active" ariaCurrentWhenActive="page"
      >Personajes</a
    >
    <a routerLink="/salas" routerLinkActive="active" ariaCurrentWhenActive="page">Salas</a>
  </nav>
  <div class="account">
    @if (session.user(); as user) {
      <span class="account__name">{{ user.displayName }}</span>
      <button type="button" class="link-button" (click)="logout()">Salir</button>
    } @else {
      <a routerLink="/entrar" routerLinkActive="active" ariaCurrentWhenActive="page">Entrar</a>
    }
  </div>
</header>
<main id="contenido" tabindex="-1">
  <router-outlet />
</main>
